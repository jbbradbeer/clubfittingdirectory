# Runs on every pull request and push to main.
# Catches type errors, lint errors, and failing tests BEFORE they reach the
# live site — the only gate before this was Vercel's build failing after merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Full production build — catches errors that only surface at build time
      # (e.g. a generateStaticParams query that throws, like the 1,000-row cap
      # that silently dropped 267 shops in June 2026). Needs the PUBLIC Supabase
      # credentials because pages fetch shop data while building. These are the
      # same anon values already shipped in the browser bundle — not real secrets
      # — but they live in GitHub repo secrets so they're easy to rotate.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
